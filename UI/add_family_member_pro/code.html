<!-- Bottom Actions Shell -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl p-md border-t border-outline-variant/10 z-50">
<div class="max-w-3xl mx-auto flex gap-md">
<button class="hidden flex-1 py-4 px-lg rounded-2xl border-2 border-outline text-on-surface font-title-md hover:bg-surface-container-high transition-colors active:scale-95" id="prev-btn" onclick="prevStep()">
                Back
            </button>
<button class="flex-1 py-4 px-lg rounded-2xl bg-surface-container-highest text-on-surface-variant font-title-md hover:bg-surface-dim transition-colors active:scale-95" id="cancel-btn">
                Cancel
            </button>
<button class="flex-[2] py-4 px-lg rounded-2xl bg-primary text-on-primary font-title-md shadow-xl shadow-primary/20 hover:brightness-110 transition-all active:scale-95 flex items-center justify-center gap-base" id="next-btn" onclick="nextStep()">
                Next <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="hidden flex-[2] py-4 px-lg rounded-2xl bg-primary text-on-primary font-title-md shadow-xl shadow-primary/20 hover:brightness-110 transition-all active:scale-95 flex items-center justify-center gap-base" id="save-btn">
                Save Member <span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</footer>
<script>
        let currentStep = 1;
        const totalSteps = 3;

        function updateUI() {
            // Update sections
            for (let i = 1; i <= totalSteps; i++) {
                const section = document.getElementById(`section-${i}`);
                const indicator = document.getElementById(`step-indicator-${i}`);
                const line = document.getElementById(`line-${i-1}`);

                if (i === currentStep) {
                    section.classList.remove('hidden');
                } else {
                    section.classList.add('hidden');
                }

                // Indicators
                if (i <= currentStep) {
                    indicator.classList.remove('opacity-40');
                    indicator.querySelector('div').classList.add('bg-primary', 'text-on-primary');
                    indicator.querySelector('div').classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                } else {
                    indicator.classList.add('opacity-40');
                    indicator.querySelector('div').classList.remove('bg-primary', 'text-on-primary');
                    indicator.querySelector('div').classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                }
            }

            // Update lines
            if(currentStep > 1) document.getElementById('line-1').classList.remove('opacity-30');
            if(currentStep > 2) document.getElementById('line-2').classList.remove('opacity-30');

            // Button Logic
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const saveBtn = document.getElementById('save-btn');

            if (currentStep === 1) {
                prevBtn.classList.add('hidden');
                cancelBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                saveBtn.classList.add('hidden');
            } else if (currentStep === totalSteps) {
                prevBtn.classList.remove('hidden');
                cancelBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                saveBtn.classList.remove('hidden');
            } else {
                prevBtn.classList.remove('hidden');
                cancelBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                saveBtn.classList.add('hidden');
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Simple mock for "Save" interaction
        document.getElementById('save-btn').addEventListener('click', (e) => {
            e.preventDefault();
            const btn = e.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...';
            setTimeout(() => {
                btn.innerHTML = 'Success! <span class="material-symbols-outlined">done_all</span>';
                btn.classList.replace('bg-primary', 'bg-secondary');
                setTimeout(() => history.back(), 1000);
            }, 1500);
        });
    </script>
