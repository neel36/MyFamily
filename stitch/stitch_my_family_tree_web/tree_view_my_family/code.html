<script>
        // Simple Canvas Interaction Logic
        const canvas = document.getElementById('canvas');
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            canvas.classList.add('grabbing');
            startX = e.pageX - canvas.offsetLeft;
            startY = e.pageY - canvas.offsetTop;
            // Simplified positioning logic for demo
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Basic Pan Micro-interaction
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            // Panning logic would go here
        });

        // Micro-interaction for nodes
        document.querySelectorAll('.node-card').forEach(card => {
            card.addEventListener('click', function() {
                // Future: Open Bottom Sheet with Details
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
